site_name: Tercen policy documents
site_url: https://policies.tercen.com/
site_author: "Tercen Authors"
site_description: "Tercen standard terms and conditions"
docs_dir: docs/
use_directory_urls: true

copyright: Copyright &copy; 2024 Tercen

# A small theme of our own (theme/): Tercen tokens, self-hosted Fira Sans, and one script, the
# "Back to tercen.com" link (docs/assets/js/back-link.js). No framework JavaScript, no web fonts
# from elsewhere.
theme:
  name: null
  custom_dir: theme/
  static_templates:
    - 404.html

# Every file name here is its public URL: /privacy/, /terms-of-service/, /cookies-and-subprocessors/.
# The main site links to those three, so they must not change.
nav:
  - Introduction: index.md
  - Privacy Policy: privacy.md
  - Terms of Service: terms-of-service.md
  - Cookies and Sub-processors: cookies-and-subprocessors.md
  - Professional Services T&C: professional-services-terms.md
  - Licence: policy-licence.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true

# With --strict, any of these is a build failure.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

# No search: six documents, all listed on every page. (MkDocs adds its search plugin unless told not to.)
plugins: []
